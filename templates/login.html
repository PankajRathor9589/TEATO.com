<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEATO - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: white; }
        .btn-teato { background: #dc3545; color: white; border-radius: 25px; padding: 10px; width: 100%; }
        .btn-teato:hover { background: #c82333; color: white; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h2 class="fw-bold text-danger mb-4">TEATO</h2>
        <h5 class="mb-4">Apne Account mein Login Karein</h5>
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3 text-start">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Username dalein" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Password dalein" required>
            </div>
            <button type="submit" class="btn btn-teato mb-3">Login</button>
        </form>
        
        <p class="small text-muted">Naya account chahiye? <a href="/signup/" class="text-danger">Signup karein</a></p>
    </div>
</body>
</html>
