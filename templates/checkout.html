<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 card shadow p-4 border-0 rounded-4">
            <h2 class="text-danger fw-bold text-center">Checkout</h2>
            <hr>
            <div class="mb-4">
                {% for item in items %}
                <div class="d-flex justify-content-between mb-2">
                    <span>{{ item.name }} - ₹{{ item.price }}</span>
                    <a href="/remove-from-cart/{{ item.id }}/" class="btn btn-sm btn-outline-danger">Remove</a>
                </div>
                {% endfor %}
                <div class="d-flex justify-content-between border-top pt-2 mt-2">
                    <h4>Total:</h4>
                    <h4 class="text-danger">₹{{ total }}</h4>
                </div>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <input type="text" name="name" placeholder="Full Name" class="form-control mb-3" required>
                <input type="text" name="phone" placeholder="Phone Number" class="form-control mb-3" required>
                <textarea name="address" placeholder="Delivery Address" class="form-control mb-3" required></textarea>
                <label class="mb-2">Rate our Food:</label>
                <select name="rating" class="form-select mb-4">
                    <option value="5">⭐⭐⭐⭐⭐</option>
                    <option value="4">⭐⭐⭐⭐</option>
                    <option value="3" selected>⭐⭐⭐</option>
                </select>
                <button type="submit" class="btn btn-danger w-100 btn-lg shadow rounded-pill">Place Final Order</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
