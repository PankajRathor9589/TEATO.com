# TEATO - Docker Compose for local/dev or single-host deployment
# Usage: docker-compose up -d
# API: http://localhost:5000  MongoDB: localhost:27017

version: '3.8'

services:
  api:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/teato
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - UPLOAD_PATH=/app/uploads
    depends_on:
      - mongo
    volumes:
      - teato_uploads:/app/uploads

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - teato_mongo:/data/db

volumes:
  teato_mongo:
  teato_uploads:
